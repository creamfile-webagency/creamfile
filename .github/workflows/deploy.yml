# Deploy the Cloudflare Worker on push to main.
# Required GitHub repo secrets:
#   CLOUDFLARE_API_TOKEN  — token with Workers Scripts Write + Cache Purge permissions
#   CLOUDFLARE_ACCOUNT_ID — value: 36953f6e0a30adb1e9d933838337cdf0
# Optional build-time env vars: PUBLIC_TURNSTILE_SITEKEY (Turnstile widget site key).
# Runtime Worker secrets (set once via `wrangler secret put`): TURNSTILE_SECRET, RESEND_API_KEY.
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.PUBLIC_TURNSTILE_SITEKEY }}
      - run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/40a293c9d10a48893a35b57d2d3a34aa/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | tee /tmp/purge.json
          python3 -c "import json,sys; d=json.load(open('/tmp/purge.json')); sys.exit(0 if d.get('success') else 1)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
