# Creamfile — portföljdata för creamfile.com
# Redigera den här filen för att lägga till, ta bort eller flytta sajter.
# Sajten byggs om automatiskt vid push. Ordningen i filen = ordningen på sajten.
#
# group:       ett av id:na under groups
# languages:   sv, da, no, nl, en eller multi
# status:      live | building   (building visar etiketten "Under uppbyggnad")
# url:         punycode för IDN-domäner (bröllop.se = xn--brllop-xxa.se)
# featured:    true = visas i hero-texten på startsidan (max 5)
# hidden:      true = döljs från sajten utan att raderas
groups:
- id: guider
  name: Guider & leads
  internal: Service apps
  intro: Hitta och välja rätt leverantör. Katalog över hela Sverige, premiumprofiler och leads för företagen i kategorin.
- id: finans
  name: Finansmarknad & trading
  internal: Investviewer
  intro: Följa kurser och marknader, handla med bättre verktyg. Fjorton sajter på fem språk — InvestViewer-nätverket.
- id: privatekonomi
  name: Privatekonomi
  internal: Personal Finance
  intro: Räkna, jämföra och bevaka sin egen ekonomi — på hushållets egen data.
- id: spel
  name: Spel
  internal: Webgames
  intro: Spela, lösa, lära. Dagliga pussel och quiz som folk återkommer till — räckvidd varje dag.
- id: sport
  name: Sport
  internal: Sport apps
  intro: Följa, träna, hitta. Publiken först — produkter sedan.
- id: handel
  name: Handel
  internal: Ecom
  intro: E-handel med eget lager i Sverige.
