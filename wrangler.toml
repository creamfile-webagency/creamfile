name = "creamfile-com"
account_id = "36953f6e0a30adb1e9d933838337cdf0"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "creamfile.com/*", zone_name = "creamfile.com" },
  { pattern = "www.creamfile.com/*", zone_name = "creamfile.com" }
]

[assets]
# Without run_worker_first=true Cloudflare would serve static assets directly,
# bypassing the www->apex redirect middleware in src/middleware.ts.
run_worker_first = true

[vars]
# Non-secret vars go here. Secrets are set via `wrangler secret put` and never stored in repo:
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put RESEND_API_KEY

