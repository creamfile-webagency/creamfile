name = "creamfile-com"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "creamfile.com/*", zone_name = "creamfile.com" },
  { pattern = "www.creamfile.com/*", zone_name = "creamfile.com" }
]

[vars]
# Non-secret vars go here. Secrets are set via `wrangler secret put` and never stored in repo:
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put RESEND_API_KEY

